[package]
name = "bokuei-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bokuei-agent"
path = "src/main.rs"

[dependencies]
tq-claims = { path = "../tq-claims" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
libc = "0.2"
nix = { version = "0.29", features = ["ptrace", "process", "signal", "fs", "uio"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
toml = "0.8"

[dev-dependencies]
tempfile = "3.17"
