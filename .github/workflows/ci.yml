name: CI & Reproducible Release Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-gate:
    name: Rust Toolchain Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rustfmt Check
        run: cargo fmt --check

      - name: Clippy Linter
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo Test
        run: cargo test --workspace

  go-gate:
    name: Go Toolchain Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Gofmt Check
        run: |
          test -z "$(gofmt -l .)"

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test -v ./...

      - name: Dependency License Check
        run: |
          # Verify dependencies do not violate license policy
          go list -m all

  reproducible-build:
    name: Reproducible Binary Build
    needs: [rust-gate, go-gate]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build Bokuei Reproducible Binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -buildid=" -o dist/bokuei ./cmd/bokuei
          sha256sum dist/bokuei
